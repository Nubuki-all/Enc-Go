name: GoLint
on: push
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'enc/go.mod'
          cache-dependency-path: 'enc/go.sum'
      - name: update golang dependencies
        run: cd enc && go get -u && go mod tidy
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        continue-on-error: true
        with:
          version: v2.1 # Specify a golangci-lint version
          working-directory: enc
          #skip-cache: true
          args: --issues-exit-code=0 # Exit with 0 even if issues are found, useful for reformatting
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest
      - name: reformat go
        run: cd enc && gofumpt -l -w .
      # commit changes
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'GoLint: auto-fixes'
          commit_options: '--no-verify'
          repository: .
          commit_user_name: Nubuki-all
          commit_user_email: 121189493+Nubuki-all@users.noreply.github.com
          commit_author: Nubuki-all <121189493+Nubuki-all@users.noreply.github.com>
