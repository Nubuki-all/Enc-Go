name: Build (musl) amd64, arm64, armv7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BINARY: enc
  PACKAGE: enc
  GO_VERSION: 1.24.7

jobs:
  # Native amd64 musl on runner
  build-amd64-musl:
    name: Build linux/amd64 (musl, native)
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ env.PACKAGE }}/dist/${{ env.BINARY }}-linux-amd64-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools curl ca-certificates pkg-config || true

      - name: Download Go (amd64) locally
        run: |
          set -euo pipefail
          GO_PKG="linux-amd64"
          GO_TARBALL="https://go.dev/dl/go${GO_VERSION}.${GO_PKG}.tar.gz"
          curl -fsSL "${GO_TARBALL}" -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version

      - name: Build (amd64 musl)
        env:
          CGO_ENABLED: "1"
          CC: "musl-gcc"
          GOOS: "linux"
          GOARCH: "amd64"
        run: |
          set -euo pipefail
          cd "${PACKAGE}"
          mkdir -p dist
          /usr/local/go/bin/go build -a -installsuffix cgo -tags netgo \
            -ldflags "-s -w -linkmode external -extldflags '-static'" \
            -o "dist/${BINARY}-linux-amd64-musl" .
          file "dist/${BINARY}-linux-amd64-musl" || true
          ls -l dist/

      - name: Upload artifact (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-linux-amd64-musl
          path: ${{ env.PACKAGE }}/dist/${{ env.BINARY }}-linux-amd64-musl

  # Cross-build arm64 & armv7 using a matrix with dockcross images
  build-arm-matrix:
    name: Build linux/arm (matrix)
    runs-on: ubuntu-latest
    needs: build-amd64-musl
    strategy:
      matrix:
        include:
          - name: arm64
            dockcross_image: dockcross/linux-arm64-musl
            go_pkg: linux-arm64
            goarch: arm64
            go_tarball_suffix: linux-arm64
            output_suffix: linux-arm64-musl
          - name: armv7
            dockcross_image: dockcross/linux-armv7l-musl
            go_pkg: linux-armv6l
            goarch: arm
            go_tarball_suffix: linux-armv6l
            output_suffix: linux-armv7-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #- name: Ensure QEMU and register binfmt (for non-native container)
      #  run: |
      #    docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Pull dockcross helper script
        run: |
          # Create dockcross helper in repo root so we can call it from subfolders
          docker run --rm ${{ matrix.dockcross_image }} > ./dockcross-${{ matrix.name }}
          chmod +x ./dockcross-${{ matrix.name }}

      - name: Build inside dockcross (matrix)
        env:
          GO_VERSION: ${{ env.GO_VERSION }}
          PACKAGE: ${{ env.PACKAGE }}
          BINARY: ${{ env.BINARY }}
        run: |
          set -euo pipefail

          # Build variables for this matrix row
          DOCKCROSS=./dockcross-${{ matrix.name }}
          TAR_SUFFIX=${{ matrix.go_tarball_suffix }}
          OUTPUT="${PACKAGE}/dist/${BINARY}-${{ matrix.output_suffix }}"
          mkdir -p "${PACKAGE}/dist"

          # Run the build inside the container. Note:
          # - /work inside dockcross is the repository root mounted from runner
          # - We construct GO_TARBALL inside the container (escaped \$) to avoid shell expansion issues
          ${DOCKCROSS} bash -lc "\
            set -euo pipefail; \
            GO_TARBALL=https://go.dev/dl/go${GO_VERSION}.${TAR_SUFFIX}.tar.gz; \
            curl -fsSL $GO_TARBALL -o /tmp/go.tgz; tar -C /tmp -xzf /tmp/go.tgz; export PATH=/tmp/go/bin:\$PATH; \
            go version; mkdir -p /work/${PACKAGE}/dist; \
            export CGO_ENABLED=1; export GOOS=linux; export GOARCH=${{ matrix.goarch }}; \
            cd /work/${PACKAGE}; \
            go build -a -installsuffix cgo -tags netgo -ldflags \"-s -w -linkmode external -extldflags '-static'\" -o /work/${OUTPUT} .; \
            echo built /work/${OUTPUT}; \
          "

      - name: Show built artifact (runner)
        run: |
          echo "Artifacts inside repo:"
          ls -la "${PACKAGE}/dist" || true

      - name: Upload artifact (matrix)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-${{ matrix.output_suffix }}
          path: ${{ env.PACKAGE }}/dist/${{ env.BINARY }}-${{ matrix.output_suffix }}
  release:
    runs-on: ubuntu-latest
    needs: [build-amd64-musl, build-arm-matrix]
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: binaries
    - name: Upload shared library to draft release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        files: |
          binaries/*
        generate_release_notes: true
        tag_name: latest
