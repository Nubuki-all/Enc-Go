name: Build linux (amd64, arm64, armv7) and windows (amd64, arm64)

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  workflow_dispatch:

env:
  BINARY: enc
  PACKAGE: .  # Go module root
  GO_VERSION: 1.26.1

jobs:
  # Native builds on x86_64 and arm64 runners, statically linked against musl.
  build-linux:
    name: Build linux/${{ matrix.goarch }} (musl, native)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: musl-gcc
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -a -installsuffix cgo -tags netgo \
            -ldflags "-s -w -linkmode external -extldflags '-static'" \
            -o "dist/${BINARY}-linux-${GOARCH}-musl" .
          file "dist/${BINARY}-linux-${GOARCH}-musl"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY }}-linux-${{ matrix.goarch }}-musl
          path: dist/${{ env.BINARY }}-linux-${{ matrix.goarch }}-musl

  # Native Windows builds. cgo is needed for the Telegram session store
  # (mattn/go-sqlite3), so each runner gets a MinGW toolchain from MSYS2.
  build-windows:
    name: Build windows/${{ matrix.goarch }} (native)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: windows-latest
            msystem: UCRT64
            cc_package: mingw-w64-ucrt-x86_64-gcc
            cc: gcc
          - goarch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            cc_package: mingw-w64-clang-aarch64-clang
            cc: clang
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit # keep Go from setup-go on PATH
          install: ${{ matrix.cc_package }}

      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-s -w -extldflags '-static'" \
            -o "dist/${BINARY}-windows-${GOARCH}.exe" .
          file "dist/${BINARY}-windows-${GOARCH}.exe" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY }}-windows-${{ matrix.goarch }}
          path: dist/${{ env.BINARY }}-windows-${{ matrix.goarch }}.exe

  # armv7 has no native runner: cross-build in a dockcross container.
  build-arm-matrix:
    name: Build linux/armv7 (dockcross)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: armv7
            dockcross_image: dockcross/linux-armv7l-musl
            go_tarball_suffix: linux-armv6l
            output_suffix: linux-armv7-musl
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore cached Go tarball (matrix)
        uses: actions/cache@v5
        id: cache-go-tar
        with:
          path: ./.cache/go.tgz
          key: go-tarball-${{ env.GO_VERSION }}-${{ matrix.name }}

      - name: Ensure Go tarball exists (download if cache miss)
        run: |
          mkdir -p ./.cache
          if [ ! -f ./.cache/go.tgz ]; then
            echo "Go tarball not cached. Downloading..."
            # use the amd64 tarball; we extract it inside the container (dockcross) and it will work
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o ./.cache/go.tgz
          else
            echo "Using cached go tarball"
          fi
        shell: bash

      - name: Restore module/build cache (workspace-scoped cache)
        uses: actions/cache@v5
        with:
          path: ./.cache/go
          key: go-mod-workspace-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}-${{ matrix.name }}
          restore-keys: |
            go-mod-workspace-${{ env.GO_VERSION }}-${{ matrix.name }}-

      - name: Pull dockcross helper script
        run: |
          # create dockcross helper in repo root
          docker run --rm ${{ matrix.dockcross_image }} > ./dockcross-${{ matrix.name }}
          chmod +x ./dockcross-${{ matrix.name }}

      - name: Build inside dockcross (matrix)
        env:
          GO_VERSION: ${{ env.GO_VERSION }}
          PACKAGE: ${{ env.PACKAGE }}
          BINARY: ${{ env.BINARY }}
        run: |
          set -euo pipefail

          DOCKCROSS=./dockcross-${{ matrix.name }}
          TAR_PATH="/work/.cache/go.tgz"
          OUTPUT_PATH="/work/${PACKAGE}/dist/${BINARY}-${{ matrix.output_suffix }}"

          mkdir -p "${PACKAGE}/dist"
          mkdir -p ./.cache

          # Copy the cached tarball into workspace root (it already is in ./.cache/go.tgz)
          # We will use the tarball inside the container at /work/.cache/go.tgz

          # Build command inside container:
          # - extract /work/.cache/go.tgz into /tmp/go
          # - set GOPATH/GOMODCACHE/GOCACHE to /work/.cache/go* to reuse host cache
          # - run go build with CGO enabled (dockcross image provides the musl toolchain)
          # armv7: set GOARM=7
          ${DOCKCROSS} bash -lc "\
            set -euo pipefail; \
            if [ ! -f /work/.cache/go.tgz ]; then echo '/work/.cache/go.tgz not found inside container'; exit 2; fi; \
            tar -C /tmp -xzf /work/.cache/go.tgz; export PATH=/tmp/go/bin:\$PATH; \
            go version; mkdir -p /work/${PACKAGE}/dist; mkdir -p /work/.cache/go; \
            export CGO_ENABLED=1; export GOOS=linux; export GOARCH=${{ matrix.goarch }}; export GOARM=7; \
            export GOPATH=/work/.cache/go; export GOMODCACHE=/work/.cache/go/pkg/mod; export GOCACHE=/work/.cache/go-build; \
            cd /work/${PACKAGE}; \
            go build -a -installsuffix cgo -tags netgo -ldflags \"-s -w -linkmode external -extldflags '-static'\" -o ${OUTPUT_PATH} .; \
          "

      - name: Show built artifact (runner)
        run: |
          echo "Artifacts inside repo:"
          ls -la "${PACKAGE}/dist" || true


      - name: Upload artifact (matrix)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY }}-${{ matrix.output_suffix }}
          path: ${{ env.PACKAGE }}/dist/${{ env.BINARY }}-${{ matrix.output_suffix }}

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-arm-matrix, build-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: binaries
  
      - name: Delete workflow artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            enc*
  
      - name: Set release timestamp
        run: echo "CURRENT_TIME=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh

      - name: Delete existing latest release
        run: |
          gh release delete latest -y || true
          git push --delete origin latest || true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload static executable
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            binaries/*
          generate_release_notes: true
          tag_name: ${{ env.CURRENT_TIME }}

      - name: Upload static executable as latest release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            binaries/*
          generate_release_notes: true
          tag_name: latest
